services:
  - type: web
    name: buildasset-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/buildasset-monolith/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://ps048-on-demand-construction-equipment.onrender.com
      - key: EQUIPMENT_SERVICE_URL
        value: http://localhost:8080/api/equipment
      - key: RENTAL_SERVICE_URL
        value: http://localhost:8080/api/rentals
